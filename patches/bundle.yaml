# dsh-mascot-plugin · Bundle Patch
#
# Bundle Patch 只做一件事：声明这个 bundle 往插件树里插入什么。
# 本插件要成为 Loader 里的一行 entry，宿主才会去读 package.json 的 dsh.client，
# 进而把浏览器半场编进 window.__DSH_BOOT__ —— 所以这里需要 insert 一行。
#
# 如果你确认宿主已能自行装配（例如只做纯样式注入、不需要宿主半场），
# 把下面整段替换成 [] 即可（"无侵入修改填 []"）。
#
# 想临时禁用，不要改这份文件（升级会被覆盖），在自己的 profile cordis.patch.yml 里按 id 覆盖：
#   - id: ui-mascot
#     disabled: true
- insert:
    - id: ui-mascot
      name: 'dsh-mascot-plugin'
