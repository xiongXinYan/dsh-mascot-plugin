name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      # 产物必须真的是 Loader 认的外壳，否则装了也是白装
      - name: 校验 client 产物外壳
        run: |
          grep -q '__ModuleLoader__.load' lib/client.js
          grep -q 'id: "dsh-mascot-plugin"' lib/client.js

      # lib/ 是入库的：源码改了却忘了提交产物，源码安装的用户会拿到旧的客户端
      - name: 校验产物与源码一致
        run: git diff --exit-code -- lib/client.js assets/models.json
