<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dsh-mascot-plugin · 本地预览</title>
    <style>
      :root {
        --bg: #14161a;
        --panel: #1b1e24;
        --panel-2: #22262e;
        --line: #2c313a;
        --text: #e6e8ec;
        --text-dim: #9aa1ad;
        --brand: #6f9df0;
        --accent: #ff8fab;
      }

      html[data-theme='light'] {
        --bg: #f5f6f8;
        --panel: #ffffff;
        --panel-2: #f0f2f5;
        --line: #e3e6eb;
        --text: #1f2328;
        --text-dim: #6b7280;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        font:
          14px/1.6 -apple-system,
          'Segoe UI',
          'Microsoft YaHei',
          sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .app {
        display: grid;
        grid-template-columns: 232px 1fr;
        height: 100%;
      }

      /* ---------- 侧栏 ---------- */
      .side {
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 14px 12px;
        background: var(--panel);
        border-right: 1px solid var(--line);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 2px 4px;
        font-weight: 650;
        letter-spacing: 0.2px;
      }

      .brand i {
        width: 18px;
        height: 18px;
        border-radius: 6px;
        background: linear-gradient(140deg, var(--brand), #4368c9);
      }

      .new-task {
        padding: 7px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel-2);
        color: var(--text);
        font: inherit;
        text-align: left;
        cursor: pointer;
      }

      .side-label {
        padding: 0 6px;
        font-size: 11px;
        letter-spacing: 0.4px;
        text-transform: uppercase;
        color: var(--text-dim);
      }

      .threads {
        display: grid;
        gap: 2px;
        margin: 0;
        padding: 0;
        list-style: none;
        overflow: auto;
      }

      .threads li {
        padding: 7px 8px;
        border-radius: 7px;
        color: var(--text-dim);
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .threads li[aria-current='true'] {
        background: var(--panel-2);
        color: var(--text);
      }

      /* ---------- 主区 ---------- */
      .main {
        display: grid;
        grid-template-rows: auto 1fr auto;
        min-width: 0;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 22px;
        border-bottom: 1px solid var(--line);
      }

      .topbar h1 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
      }

      .topbar span {
        color: var(--text-dim);
        font-size: 12px;
      }

      .feed {
        display: flex;
        flex-direction: column;
        gap: 18px;
        padding: 26px 22px 10px;
        overflow: auto;
      }

      .msg {
        max-width: 680px;
        display: grid;
        gap: 6px;
      }

      .msg--user {
        align-self: flex-end;
        justify-items: end;
      }

      .who {
        font-size: 11px;
        color: var(--text-dim);
      }

      .bubble {
        padding: 10px 13px;
        border-radius: 10px;
        background: var(--panel);
        border: 1px solid var(--line);
      }

      .msg--user .bubble {
        background: var(--panel-2);
        border-color: transparent;
      }

      .tool {
        margin-top: 8px;
        padding: 9px 11px;
        border-radius: 8px;
        border: 1px dashed var(--line);
        background: color-mix(in oklab, var(--panel-2) 70%, transparent);
        font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
        font-size: 12px;
        color: var(--text-dim);
      }

      .composer {
        display: flex;
        gap: 8px;
        align-items: flex-end;
        width: min(720px, calc(100% - 44px));
        margin: 0 auto 18px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel);
      }

      .composer .field {
        flex: 1;
        min-height: 22px;
        padding: 2px 4px;
        color: var(--text-dim);
      }

      .composer .send {
        padding: 5px 12px;
        border: 0;
        border-radius: 8px;
        background: var(--brand);
        color: #fff;
        font: inherit;
        font-size: 12px;
      }

      /* 宿主的主题变量：插件默认跟系统明暗，这里显式喂给它，切主题才跟手 */
      html[data-theme='dark'] .dsh-mascot {
        --mascot-surface: rgba(32, 35, 42, 0.97);
        --mascot-line: rgba(255, 255, 255, 0.14);
        --mascot-shadow: 0 14px 34px rgba(0, 0, 0, 0.45);
      }

      /* ---------- 预览控制条（不属于插件，只是给这页用的） ---------- */
      .deck {
        position: fixed;
        left: 16px;
        bottom: 16px;
        z-index: 70;
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        width: 200px;
        padding: 8px 10px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: color-mix(in oklab, var(--panel) 88%, transparent);
        backdrop-filter: blur(10px);
        font-size: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
      }

      .deck b {
        margin-right: 2px;
        font-weight: 600;
        color: var(--text-dim);
      }

      .deck button {
        padding: 4px 9px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: transparent;
        color: var(--text-dim);
        font: inherit;
        cursor: pointer;
      }

      .deck button:hover {
        color: var(--text);
        border-color: var(--brand);
      }

      .deck .sep {
        width: 100%;
        height: 0;
        margin: 0;
        background: none;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="side">
        <div class="brand"><i></i>DeepSeek Harness</div>
        <button class="new-task" type="button">+ 新对话</button>
        <div class="side-label">最近</div>
        <ul class="threads">
          <li aria-current="true">dsh 看板娘插件</li>
          <li>重构审批流的事件处理</li>
          <li>把 CI 从 Jenkins 挪走</li>
          <li>SQL 慢查询排查</li>
          <li>周报生成脚本</li>
        </ul>
      </aside>

      <main class="main">
        <header class="topbar">
          <h1>dsh 看板娘插件</h1>
          <span>main · 工作区 dsh-mascot-plugin</span>
        </header>

        <div class="feed">
          <div class="msg msg--user">
            <div class="who">你</div>
            <div class="bubble">先把插件骨架跑起来，我要看效果。</div>
          </div>

          <div class="msg">
            <div class="who">DSH</div>
            <div class="bubble">
              骨架已经能跑：宿主入口、bundle patch、客户端投放都通了。
              <div class="tool">pnpm check · typecheck 0 错 · vitest 11 passed · build ok</div>
            </div>
          </div>

          <div class="msg">
            <div class="who">DSH</div>
            <div class="bubble">右下角那位就是它。鼠标在页面上移动，她会跟着看。</div>
          </div>
        </div>

        <div class="composer">
          <div class="field">给 DSH 发消息…</div>
          <button class="send" type="button">发送</button>
        </div>
      </main>
    </div>

    <!-- 控制条：只是给预览页用的，不在插件里 -->
    <div class="deck">
      <b>姿态</b>
      <button type="button" data-act="idle">待机</button>
      <button type="button" data-act="working">干活</button>
      <button type="button" data-act="waiting">等确认</button>
      <button type="button" data-act="sleepy">打盹</button>
      <button type="button" data-act="happy">开心</button>
      <span class="sep"></span>
      <button type="button" data-act="theme">切主题</button>
    </div>

    <script>
      /* ------------------------------------------------------------------
       * 1. Loader 桩：只实现 factory/require 这一层，够 apply() 用
       * ------------------------------------------------------------------ */
      window.__ModuleLoader__ = {
        load({ id, factory }) {
          const exports = factory((name) => {
            if (name === 'react') return ReactStub
            throw new Error(`预览桩没有提供模块：${name}`)
          })
          window.__dshMascot = { id, exports }
          boot(exports)
        },
      }

      /* ------------------------------------------------------------------
       * 2. 极简 React 桩：够 createElement / useEffect / useRef 用
       * ------------------------------------------------------------------ */
      const ReactStub = {
        createElement(type, props, ...children) {
          if (typeof type === 'function') return type(props)
          const el = document.createElement(type)
          for (const [key, value] of Object.entries(props || {})) {
            if (key === 'ref') {
              if (value) value.current = el
            } else if (key === 'className') {
              el.className = value
            } else if (key === 'style') {
              Object.assign(el.style, value)
            } else if (value !== false && value != null) {
              el.setAttribute(key, value)
            }
          }
          for (const child of children.flat()) {
            if (child == null) continue
            el.appendChild(typeof child === 'string' ? document.createTextNode(child) : child)
          }
          return el
        },
        useEffect(run) {
          queueMicrotask(() => {
            const cleanup = run()
            if (typeof cleanup === 'function') window.addEventListener('pagehide', cleanup)
          })
        },
        useRef(initial) {
          return { current: initial }
        },
      }

      /* ------------------------------------------------------------------
       * 3. 宿主装配：effect 立即执行，slot 注册立即渲染
       * ------------------------------------------------------------------ */
      function boot(exports) {
        const ctx = {
          effect(run, label) {
            const dispose = run()
            console.debug('[preview] effect:', label, typeof dispose)
          },
          slots: {
            inject(slot, factory) {
              console.debug('[preview] slots.inject:', slot)
              factory()
            },
            register(registration, component) {
              console.debug('[preview] slots.register:', registration)
              document.body.appendChild(component({}))
              return { dispose() {} }
            },
          },
        }

        exports.apply(ctx)
        console.info('[preview] 板娘已挂载；改 src/ 会自动重新打包，刷新页面即可')
      }

      /* ------------------------------------------------------------------
       * 4. 控制条：走插件真正的姿态入口（自定义事件 → resolveMood）
       * ------------------------------------------------------------------ */
      const SIGNAL_EVENT = 'dsh-mascot:signal'

      function sendSignal(detail) {
        window.dispatchEvent(new CustomEvent(SIGNAL_EVENT, { detail }))
      }

      const ACTIONS = {
        idle: () =>
          sendSignal({ running: false, awaitingApproval: false, lastActivityAt: Date.now() }),
        working: () => sendSignal({ running: true, awaitingApproval: false }),
        waiting: () => sendSignal({ running: true, awaitingApproval: true }),
        sleepy: () =>
          sendSignal({
            running: false,
            awaitingApproval: false,
            lastActivityAt: Date.now() - 10 * 60 * 1000,
          }),
        // 开心不是信号能推出来的（它来自"被点"），所以直接点她一下
        happy: () => document.querySelector('.dsh-mascot__body')?.click(),
      }

      document.querySelector('.deck').addEventListener('click', (event) => {
        const act = event.target.closest('button')?.dataset.act
        if (!act) return

        if (act === 'theme') {
          const html = document.documentElement
          html.dataset.theme = html.dataset.theme === 'dark' ? 'light' : 'dark'
          return
        }

        ACTIONS[act]?.()
      })

      /* ------------------------------------------------------------------
       * 5. 用地址栏直接摆状态，方便截图核对
       *    ?theme=light&mood=waiting&panel=1&bubble=1
       * ------------------------------------------------------------------ */
      const params = new URLSearchParams(location.search)

      if (params.get('theme')) document.documentElement.dataset.theme = params.get('theme')

      if (params.get('mood')) {
        setTimeout(() => ACTIONS[params.get('mood')]?.(), 250)
      }
      if (params.get('bubble')) {
        setTimeout(() => document.querySelector('.dsh-mascot__body')?.click(), 300)
      }
      if (params.get('panel')) {
        setTimeout(() => document.querySelector('.dsh-mascot__gear')?.click(), 350)
      }
      if (params.get('gaze')) {
        const [x, y] = params.get('gaze').split(',').map(Number)
        setTimeout(
          () => window.dispatchEvent(new MouseEvent('mousemove', { clientX: x, clientY: y })),
          400,
        )
      }

      /* ------------------------------------------------------------------
       * 6. lib/client.js 变化后自动刷新，省掉手动 F5
       * ------------------------------------------------------------------ */
      let lastStamp = ''
      setInterval(async () => {
        try {
          const response = await fetch('../lib/client.js', { method: 'HEAD', cache: 'no-store' })
          const stamp = response.headers.get('last-modified') ?? ''
          if (lastStamp && stamp && stamp !== lastStamp) location.reload()
          lastStamp = stamp
        } catch {
          /* 服务器没起就算了 */
        }
      }, 1500)
    </script>

    <script src="../lib/client.js"></script>
  </body>
</html>
